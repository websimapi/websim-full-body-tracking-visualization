<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Body Tracking Visualization</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: #333;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }
        #controls label {
            display: block;
            margin-bottom: 5px;
        }
         #controls input[type="range"] {
            width: 150px;
         }
    </style>
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.0/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="info">Full Body, Face, and Hand Tracking Visualization</div>
    <div id="controls">
        <label for="jitter">Temporal Smoothing (Jitter Reduction):</label>
        <input type="range" id="jitter" name="jitter" min="0" max="0.99" step="0.01" value="0.8">
        <span id="jitterValue">0.80</span>
    </div>
    <script type="module" src="main.js"></script>
